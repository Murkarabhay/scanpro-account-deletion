<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ScanPro — Account Deletion</title>
<style>
body{font-family:Arial,sans-serif;background:#f6f8fa;margin:0;color:#17212b}
.wrap{max-width:680px;margin:50px auto;padding:20px}.card{background:#fff;border-radius:18px;padding:32px;box-shadow:0 8px 30px #00000014}
h1{margin-top:0}.muted{color:#65727e;line-height:1.6}
label{display:block;margin:20px 0 7px;font-weight:600}
input,textarea{width:100%;box-sizing:border-box;border:1px solid #ccd4dc;border-radius:10px;padding:12px;font-size:15px}
textarea{min-height:110px}button{margin-top:20px;background:#157a83;color:#fff;border:0;border-radius:10px;padding:13px 20px;font-weight:700}
.note{margin-top:22px;padding:15px;background:#eef7f7;border-radius:10px;line-height:1.5}
</style>
</head>
<body><div class="wrap"><div class="card">
<h1>ScanPro — Account Deletion</h1>
<p class="muted">Use this page to request deletion of your ScanPro account and associated account data.</p>
<form action="mailto:lumixtechofficial@gmail.com" method="post" enctype="text/plain">
<label>Account email address</label>
<input name="Account email" type="email" required placeholder="Enter the email used for ScanPro">
<label>Deletion request</label>
<textarea name="Deletion request" required>Please request deletion of my ScanPro account and associated account data.</textarea>
<button type="submit">Request Account Deletion</button>
</form>
<div class="note"><strong>What happens next?</strong><br>We will review the request and process deletion of the ScanPro account and associated account data according to our data-retention requirements.</div>
</div></div></body></html>
